[build-system]
requires = ["setuptools>=65.6.3"]
build-backend = "setuptools.build_meta"

[project]
name = "uorf_predictor"
description = "Paquete para predecir la traducción de uORFs en base a características genómicas"
authors = [
    { name = "Alejandro Pinto Alba", email = "alejandropintoalba@gmail.com" }
]

readme = "README.md"
requires-python = ">=3.10"
keywords = ["uorf", "library"]
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dynamic = ["version"]

dependencies = [
    "numpy >= 1.23, <2.0",
    "pandas >= 2.0.0, <3.0",
    "requests >= 2.32.0, <3.0",
    "pysam >= 0.22.0, <0.23",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0, <9.0.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-copybutton>=0.5.0",
    "sphinx-rtd-theme>=1.3.0",
]

[project.urls]
homepage = "https://github.com/Ale-pinto-alba/uorf_predictor"
repository = "https://github.com/Ale-pinto-alba/uorf_predictor.git"
documentation = "https://github.com/Ale-pinto-alba/uorf_predictor"
bugtracker = "https://github.com/Ale-pinto-alba/uorf_predictor/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = { attr = "uorf_predictor.__version__" }
